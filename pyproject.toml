[build-system]
requires = ["setuptools>=68.0", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "atomaestro"
dynamic = ["version"]
description = "Atomaestro: publication-quality atomistic structure and trajectory visualization — CLI, browser viewer, animation, ORTEP, and terminal TUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # Library ranges stay here. The merge gate installs
    # requirements/ci-constraints.txt and does not float these ranges.
    "numpy",
    "matplotlib",
    "pillow",
    "ase",
    # Pin MolCrysKit 2a3ee11e4c708b64691181cc2cbc4b2a3625f0c6, the authorized
    # pin. It includes Mercury read_mryx 0702ed8d, lightweight CIF /
    # phone-site a4080132, the label bound that discards unselected
    # structures, plus BondRecord.role, connectivity, and disorder. It is
    # not MolCrysKit main. Do not retarget this URL to tip 7b859dd, and do
    # not invent a PyPI version.
    # The desktop extra supplies ASE, pymatgen, SciPy, spglib, and
    # defusedxml. Core MolCrysKit is NumPy, NetworkX, and Click. read_mryx
    # imports defusedxml from the desktop extra, so this dependency requests
    # that extra. requirements/ci-constraints.txt names this same commit URL
    # without the extra marker: pip 26 rejects extras in a constraint.
    # mat_viewer/capabilities.py and tests/test_ci_environment_contract.py
    # must name this same commit. A constraint URL that differs from this
    # one makes pip fail.
    # identify_molecules defaults to as_refined; shell construction defaults
    # to major. Exclusive shell selection keeps whole orientations.
    "molcrys-kit[desktop] @ git+https://github.com/SchrodingersCattt/MolCrysKit.git@2a3ee11e4c708b64691181cc2cbc4b2a3625f0c6",
]

[project.urls]
Homepage = "https://github.com/SchrodingersCattt/Atomaestro"
Repository = "https://github.com/SchrodingersCattt/Atomaestro"
Issues = "https://github.com/SchrodingersCattt/Atomaestro/issues"

[project.scripts]
mat-vis = "mat_viewer.cli:main"

[project.entry-points."mattervis.tui.renderers"]
"mattervis.native-v1" = "mat_viewer.tui.render_backend:create_native_renderer"

[project.optional-dependencies]
plotly = ["plotly"]
plotly-export = ["plotly", "kaleido"]
# 2.18.2 is the oldest Dash release the viewer callback graph is written
# against. Component tab labels start in Dash 4.0; earlier releases in
# this range receive a string label. Do not raise the floor to Dash 4
# solely to keep a component in dcc.Tab.label.
web = ["plotly", "dash>=2.18.2", "flask-sock", "flask-compress"]
tui = ["textual"]
cube = ["scikit-image"]
vtk = ["pyvista", "scikit-image"]
animation = ["imageio", "imageio-ffmpeg"]
gpu = ["wgpu>=0.20"]
all = [
    "plotly",
    "kaleido",
    "dash>=2.18.2",
    "flask-sock",
    "flask-compress",
    "textual",
    "scikit-image",
    "pyvista",
    "imageio",
    "imageio-ffmpeg",
    "wgpu>=0.20",
]
test = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "gemmi",
    "pyvista",
    "tomli; python_version < '3.11'",
]
dev = ["atomaestro[all,test]", "build", "ruff"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["mat_viewer*"]

[tool.setuptools.package-data]
mat_viewer = ["render/assets/*.js"]
"mat_viewer._bundled_skills" = ["**/*"]

[tool.setuptools.exclude-package-data]
"mat_viewer._bundled_skills" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.setuptools_scm]
write_to = "mat_viewer/_version.py"
local_scheme = "no-local-version"
fallback_version = "0.0.0+unknown"
